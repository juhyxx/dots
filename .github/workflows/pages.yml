name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No build step: publish only the files the game needs.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js fonts _site/
          touch _site/.nojekyll

      # Replace gh-pages with a single fresh commit; Pages serves that branch.
      - name: Push to gh-pages
        working-directory: _site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
